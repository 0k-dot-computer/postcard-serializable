[package]
name = "postcard-serializable-types"
version = "0.1.0"
edition = { workspace = true }
description = "Trait definitions for postcard serialization validation"
license = "MIT"
repository = "https://github.com/0k-dot-computer/postcard-serializable"
readme = "../../README.md"
keywords = ["postcard", "serde", "serialization", "derive"]

[dependencies]
serde = {workspace = true}
uuid = {workspace = true}

# On wasm32, uuid requires an explicit randomness source even when only used
# for type (de)serialization. The js backend is satisfied by the browser host
# the motif runs in; native builds keep the workspace default.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }
