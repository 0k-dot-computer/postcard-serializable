[package]
name = "postcard-serializable"
version = "0.1.0"
edition = { workspace = true }
description = "Proc macro for compile-time postcard serialization validation"
license = "MIT"
repository = "https://github.com/0k-dot-computer/postcard-serializable"
readme = "../../README.md"
keywords = ["postcard", "serde", "serialization", "derive"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }
serde = {workspace = true}
postcard = { version = "1.0", features = ["alloc"] }
postcard-serializable-types = { path = "../postcard-serializable-types" , version = "0.1.0" }
# No `workspace-hack`: this proc-macro crate sits in `x0k-sync`'s releasable
# dependency closure (sync-engine-modularity.md), and the hack would pull
# tokio via axum/hyper. Excluded in `.config/hakari.toml [traversal-excludes]`.

[dev-dependencies]
serde_json = {workspace = true}
postcard = { version = "1.0", features = ["alloc"] }
